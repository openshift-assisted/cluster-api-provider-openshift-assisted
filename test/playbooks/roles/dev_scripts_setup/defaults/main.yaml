    num_masters: 3
    num_workers: 2
    master_memory: 32768
    master_disk: 100
    master_vcpu: 16
    worker_memory: 16384
    worker_disk: 100
    worker_vcpu: 8
  sno:
    num_masters: 1
    num_workers: 0
    master_memory: 65536
    master_disk: 120
    master_vcpu: 16
