---
name: Sync from master branch

on:
  push:
    branches:
      - master

permissions:
  contents: write
  actions: write

jobs:
  fast-forward:
    runs-on: ubuntu-latest
    env:
      BRANCHES: backplane-5.1 backplane-5.2

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-forward release branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          failures=0
          for branch in ${BRANCHES}; do
            echo "Fast-forwarding ${branch} to origin/master"
            if ! git checkout -B "${branch}" "origin/${branch}"; then
              echo "::error::origin/${branch} not found; create it from master first"
              failures=$((failures + 1))
              continue
            fi
            before=$(git rev-parse "origin/${branch}")
            if ! git merge --ff-only origin/master; then
              echo "::error::${branch} has diverged from master; refusing to overwrite."
              failures=$((failures + 1))
              continue
            fi
            git push origin "${branch}"
            # Pushes made with GITHUB_TOKEN do not trigger other workflows, so
            # dispatch the image publisher explicitly.
            if [[ "$(git rev-parse "${branch}")" != "${before}" ]]; then
              gh workflow run publish_images.yaml --ref "${branch}"
            fi
          done
          exit "${failures}"
