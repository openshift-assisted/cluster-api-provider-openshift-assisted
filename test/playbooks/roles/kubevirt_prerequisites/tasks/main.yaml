---
- name: Wait for OpenShift Virtualization to become available
  kubernetes.core.k8s_info:
    api_version: hco.kubevirt.io/v1
    kind: HyperConverged
    name: kubevirt-hyperconverged
    namespace: openshift-cnv
  register: hyperconverged
  until: >-
    hyperconverged.resources | default([]) | length == 1 and
    hyperconverged.resources[0].status.conditions | default([]) |
    selectattr('type', 'equalto', 'Available') |
    selectattr('status', 'equalto', 'True') |
    list | length == 1 and
    hyperconverged.resources[0].status.conditions | default([]) |
    selectattr('type', 'equalto', 'Progressing') |
    selectattr('status', 'equalto', 'False') |
    list | length == 1 and
    hyperconverged.resources[0].status.conditions | default([]) |
    selectattr('type', 'equalto', 'Degraded') |
    selectattr('status', 'equalto', 'False') |
    list | length == 1 and
    hyperconverged.resources[0].status.conditions | default([]) |
    selectattr('type', 'equalto', 'Upgradeable') |
    selectattr('status', 'equalto', 'True') |
    list | length == 1
  retries: "{{ medium_retries | int }}"
  delay: "{{ medium_delay | int }}"

- name: Verify that the tenant storage class exists
  kubernetes.core.k8s_info:
    api_version: storage.k8s.io/v1
    kind: StorageClass
    name: "{{ kubevirt_storage_class }}"
  register: management_storage_class_info
  failed_when: management_storage_class_info.resources | length != 1
