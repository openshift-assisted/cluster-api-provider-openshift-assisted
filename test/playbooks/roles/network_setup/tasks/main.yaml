---
- name: Get internal IP
  ansible.builtin.command: hostname -I
  register: hostname_output
  changed_when: false

# Collect candidate internal IPs, most-preferred first. Prefer a private
# (RFC1918) address from `hostname -I` -- the BMH libvirt VMs reach the kind
# API server over the host-local network, not a public IP. Accept the full
# private space (10/8, 172.16/12, 192.168/16) rather than only 10.0.0.0/8, so
# hosts whose provisioning NIC is on a different private range still work.
# Fall back to the default-route address only when no private IP is present.
- name: Build internal IP candidate list
  ansible.builtin.set_fact:
    internal_ip_candidates: >-
      {{
        ((hostname_output.stdout.split()
          | select('match', '^(10\\.|172\\.(1[6-9]|2[0-9]|3[01])\\.|192\\.168\\.)\\d{1,3}(\\.\\d{1,3}){1,2}$')
          | list)
         + [(ansible_default_ipv4 | default({})).address | default('', true)])
        | select | list
      }}

- name: Fail when no internal IP could be determined
  ansible.builtin.fail:
    msg: >-
      Could not determine an internal IP. Default-route address is unavailable
      and `hostname -I` returned no private address: {{ hostname_output.stdout }}
  when: internal_ip_candidates | length == 0

- name: Set internal IP fact
  ansible.builtin.set_fact:
    internal_ip: "{{ internal_ip_candidates | first }}"

- name: Get host DNS servers from NetworkManager
  ansible.builtin.command: nmcli --terse --get-values IP4.DNS device show
  register: nm_dns_output
  changed_when: false
  failed_when: false

- name: Set host DNS servers from NetworkManager
  ansible.builtin.set_fact:
    host_dns_servers: "{{ nm_dns_output.stdout.split() | select('match', '^\\d') | unique | list }}"
  when: nm_dns_output.stdout | trim | length > 0

- name: Fallback - get host DNS servers from /etc/resolv.conf
  ansible.builtin.shell: set -o pipefail && grep '^nameserver' /etc/resolv.conf | awk '{print $2}'
  register: resolv_conf_output
  changed_when: false
  when: host_dns_servers is not defined or host_dns_servers | length == 0

- name: Set host DNS servers from resolv.conf
  ansible.builtin.set_fact:
    host_dns_servers: "{{ resolv_conf_output.stdout_lines | select('match', '^\\d') | unique | list }}"
  when: host_dns_servers is not defined or host_dns_servers | length == 0

- name: Configure containers.conf
  ansible.builtin.copy:
    dest: /etc/containers/containers.conf
    mode: '0644'
    content: |
      [containers]
      dns_servers = ["192.168.222.1"{% for dns in host_dns_servers %}, "{{ dns }}"{% endfor %}]
      pids_limit = -1

- name: Restart podman service
  ansible.builtin.systemd_service:
    state: restarted
    daemon_reload: true
    name: podman

# create libvirt network with dns server (only recursive)
- name: Start libvirt network
  community.libvirt.virt_net:
    state: absent
    name: bmh

- name: Define libvirt network from XML
  community.libvirt.virt_net:
    command: define
    name: bmh
    xml: "{{ lookup('template', playbook_dir ~ '/../e2e/libvirt/network-bmh-onlynameserver.xml.j2') }}"

- name: Remove stale dnsmasq PID file
  ansible.builtin.file:
    path: /run/libvirt/network/bmh.pid
    state: absent

- name: Restore SELinux context on /run/libvirt
  ansible.builtin.command: restorecon -RF /run/libvirt
  changed_when: false
  failed_when: false

- name: Start libvirt network
  community.libvirt.virt_net:
    state: active
    name: bmh

- name: Set DNS nameservers in /etc/resolv.conf
  ansible.builtin.copy:
    mode: '0644'
    dest: /etc/resolv.conf
    content: |
      nameserver 192.168.222.1
      {% for dns in host_dns_servers %}
      nameserver {{ dns }}
      {% endfor %}
