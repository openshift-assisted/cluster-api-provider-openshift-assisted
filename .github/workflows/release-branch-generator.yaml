name: Release Branch Generator

on:
  workflow_dispatch:
    inputs:
      next_version:
        description: "Next version (optional, for non-sequential jumps)"
        required: false
        type: string

jobs:
  create-release:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}

      - name: Configure Git
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

      - name: Detect versions from sync-branch.yaml
        run: |
          SYNC_FILE=".github/workflows/sync-branch.yaml"

          BRANCHES_LIST=$(grep 'BRANCHES:' "${SYNC_FILE}" | head -1 | sed 's/^.*BRANCHES:[[:space:]]*//' | xargs)

          if [ -z "${BRANCHES_LIST}" ]; then
            echo "::error::Could not parse BRANCHES from ${SYNC_FILE}"
            exit 1
          fi

          # Sort versions numerically; the newest entry is the current release
          # and the one below it is the branch being frozen.
          mapfile -t SORTED_VERSIONS < <(printf '%s\n' ${BRANCHES_LIST} | sed 's/^backplane-//' | sort -t. -k1,1n -k2,2n)

          if [ "${#SORTED_VERSIONS[@]}" -lt 2 ]; then
            echo "::error::Expected at least two branches in BRANCHES, got '${BRANCHES_LIST}'"
            exit 1
          fi

          FREEZE_VERSION="${SORTED_VERSIONS[-2]}"
          CURRENT_VERSION="${SORTED_VERSIONS[-1]}"

          CURRENT_MAJOR=$(echo "${CURRENT_VERSION}" | cut -d. -f1)
          CURRENT_MINOR=$(echo "${CURRENT_VERSION}" | cut -d. -f2)

          NEXT_VERSION=$(echo "${{ github.event.inputs.next_version }}" | xargs)
          if [ -z "${NEXT_VERSION}" ]; then
            NEXT_VERSION="${CURRENT_MAJOR}.$((CURRENT_MINOR + 1))"
          else
            VERSION_REGEX='^[0-9]+\.[0-9]+$'
            if ! [[ "${NEXT_VERSION}" =~ ${VERSION_REGEX} ]]; then
              echo "::error::Invalid next version format '${NEXT_VERSION}'. Expected format: major.minor"
              exit 1
            fi
          fi

          echo "Freeze: ${FREEZE_VERSION} (backplane-${FREEZE_VERSION})"
          echo "Current: ${CURRENT_VERSION} (backplane-${CURRENT_VERSION} promoted)"
          echo "Next: ${NEXT_VERSION} (new pre-staged branch)"

          echo "FREEZE_VERSION=${FREEZE_VERSION}" >> $GITHUB_ENV
          echo "CURRENT_VERSION=${CURRENT_VERSION}" >> $GITHUB_ENV
          echo "NEXT_VERSION=${NEXT_VERSION}" >> $GITHUB_ENV

      - name: Create next branch from master
        run: |
          NEXT_BRANCH="backplane-${NEXT_VERSION}"
          git checkout master
          git pull

          if git ls-remote --heads origin "${NEXT_BRANCH}" | grep -q "${NEXT_BRANCH}"; then
            echo "::warning::Branch ${NEXT_BRANCH} already exists and will be reset to master"
          fi

          git checkout -B "${NEXT_BRANCH}"
          git push origin "${NEXT_BRANCH}" --force
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Create working branch and update files
        run: |
          CURRENT_BRANCH="backplane-${CURRENT_VERSION}"
          PR_BRANCH="mce-cutoff-${CURRENT_BRANCH}"
          git checkout master
          git checkout -B "${PR_BRANCH}"
          ./hack/branch "${CURRENT_VERSION}" "${NEXT_VERSION}" "${FREEZE_VERSION}"
          git push origin "${PR_BRANCH}" --force
        env:
          CI: "true"
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Create Pull Request
        run: |
          CURRENT_BRANCH="backplane-${CURRENT_VERSION}"
          PR_BRANCH="mce-cutoff-${CURRENT_BRANCH}"

          PR_NUMBER=$(gh pr list --head "${PR_BRANCH}" --json number -q '.[0].number')
          if [ -z "$PR_NUMBER" ]; then
            gh pr create \
              --head "${PR_BRANCH}" \
              --base master \
              --title "Freeze backplane-${FREEZE_VERSION}" \
              --body "Freeze backplane-${FREEZE_VERSION} for release and cut master over to backplane-${CURRENT_VERSION}. Pre-staging backplane-${NEXT_VERSION}."
          else
            echo "PR #${PR_NUMBER} already exists"
          fi
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
